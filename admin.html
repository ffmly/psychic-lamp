<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unibyte · Canva Giveaway Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { min-height: 100svh; padding: 28px; }
      .admin-page { width: min(1180px, 100%); margin: auto; padding: 28px; border: 1px solid #68127320; border-radius: 28px; background: #fffdfedd; box-shadow: 0 25px 80px #42054f22; }
      .admin-head, .admin-actions, .admin-login { display: flex; align-items: center; gap: 12px; }
      .admin-head { justify-content: space-between; flex-wrap: wrap; }
      .admin-head h1 { font-size: clamp(24px, 4vw, 42px); letter-spacing: -.05em; }
      .admin-login { margin: 28px 0; }
      .admin-login input { flex: 1; height: 48px; padding: 0 14px; border: 1px solid #68127335; border-radius: 12px; }
      .admin-button { height: 48px; padding: 0 18px; border: 0; border-radius: 12px; color: white; background: var(--plum); font-weight: 700; cursor: pointer; }
      .admin-button.danger { background: #b42318; }
      .admin-button:disabled { cursor: wait; opacity: .55; }
      .admin-help { margin: 20px 0; padding: 16px 18px; border: 1px solid #6812731f; border-radius: 16px; background: #faf5fc; color: #654a68; direction: rtl; text-align: right; line-height: 1.7; }
      .admin-help code { padding: 3px 7px; border-radius: 6px; background: white; color: var(--plum); font-weight: 700; }
      .admin-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
      .admin-stat { padding: 18px; border: 1px solid #68127318; border-radius: 16px; background: #faf5fc; }
      .admin-stat strong { display: block; color: var(--plum); font: 800 28px Montserrat; }
      .admin-table-wrap { overflow: auto; border: 1px solid #68127318; border-radius: 16px; }
      table { width: 100%; min-width: 950px; border-collapse: collapse; font-size: 13px; }
      th, td { padding: 12px; border-bottom: 1px solid #68127312; text-align: left; }
      th { color: #765879; background: #faf5fc; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
      .activation { padding: 7px 10px; border: 0; border-radius: 999px; font-weight: 700; cursor: pointer; }
      .activation.yes { color: #176b42; background: #e7f8ef; }
      .activation.no { color: #985809; background: #fff4dc; }
      @media (max-width: 650px) { body { padding: 10px; } .admin-page { padding: 18px; } .admin-login { flex-direction: column; } .admin-login input, .admin-login button { width: 100%; } }
    </style>
    <script src="admin.js" defer></script>
  </head>
  <body>
    <main class="admin-page">
      <header class="admin-head"><div><p class="teaser-index">OPEN DAY CAMPAIGN</p><h1>Canva Giveaway</h1></div><div class="admin-actions"><button class="admin-button" id="refresh" type="button">Refresh</button><button class="admin-button" id="export" type="button">Export CSV</button><button class="admin-button danger" id="reset-data" type="button">مسح بيانات التجارب</button></div></header>
      <div class="admin-help"><strong>كيفاش تدخل؟</strong> افتح <code>/admin.html</code> في رابط الموقع، وأدخل القيمة السرية الموجودة في Vercel باسم <code>GIVEAWAY_ADMIN_TOKEN</code>. هذا الرمز يبقى عند الأدمن فقط ولا تحطّه في كود الواجهة.</div>
      <form class="admin-login" id="admin-login"><input id="admin-token" type="password" autocomplete="current-password" placeholder="Admin token" /><button class="admin-button" type="submit">Open dashboard</button></form>
      <p id="admin-message"></p>
      <section id="admin-content" hidden>
        <div class="admin-stats"><div class="admin-stat"><strong id="claimed">0</strong>Claimed</div><div class="admin-stat"><strong id="activated">0</strong>Activated</div><div class="admin-stat"><strong id="pending">0</strong>Pending</div></div>
        <div class="admin-table-wrap"><table><thead><tr><th>#</th><th>Name</th><th>Canva email</th><th>Year</th><th>Knows Unibyte</th><th>Attendance</th><th>Interest</th><th>Score</th><th>Activation</th></tr></thead><tbody id="entries"></tbody></table></div>
      </section>
    </main>
  </body>
</html>
